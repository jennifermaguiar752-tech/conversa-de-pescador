<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<title>Conversa de Pescador</title>
<style>
:root{--a:#ffb703;--a2:#fb8500;--red:#ef476f;--blue:#118ab2;--green:#06d6a0;--ink:#0b2236;--glass:rgba(255,255,255,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Baloo 2",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 20% 0%,#1b6d97 0%,#073b5a 40%,#03192b 100%) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;left:-10%;width:120%;height:120px;bottom:-40px;background:rgba(17,138,178,.25);border-radius:45%;animation:onda 9s linear infinite;z-index:-1}
body::after{bottom:-60px;background:rgba(6,214,160,.12);animation-duration:13s}
@keyframes onda{50%{transform:translateX(5%) rotate(2deg)}}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
h1{font-size:2.3rem;margin:0;text-align:center;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h2{margin:0;font-size:1.4rem}h3{margin:.2em 0}
.sub{color:#a9d6ec;text-align:center;margin:0}
.big{font-size:3.6rem;text-align:center;line-height:1.1}
.bob{animation:bob 2.4s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:22px;padding:16px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font:800 1.15rem "Baloo 2",sans-serif;cursor:pointer;background:linear-gradient(180deg,var(--a),var(--a2));color:#3a1d00;box-shadow:0 5px 0 #b35c00;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b35c00}
.btn.sec{background:var(--glass);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2)}
.btn.blue{background:linear-gradient(180deg,#26a9d6,var(--blue));color:#fff;box-shadow:0 5px 0 #0a5c78}
.btn.red{background:linear-gradient(180deg,#ff6b8b,var(--red));color:#fff;box-shadow:0 5px 0 #a3203f}
.btn.green{background:linear-gradient(180deg,#3ef0be,#05b386);color:#04322a;box-shadow:0 5px 0 #037a5c}
.btn.ghost{background:#eaf2f7;color:var(--ink);box-shadow:0 5px 0 #c3d3de}
.btn:disabled{opacity:.4;pointer-events:none}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}
.top{display:flex;gap:6px;justify-content:space-between;align-items:center}
.ic{border:0;background:var(--glass);color:#fff;border-radius:14px;padding:8px 10px;font:700 .85rem "Baloo 2";cursor:pointer;border:1px solid rgba(255,255,255,.15)}
input[type=text]{flex:1;padding:13px;border-radius:14px;border:2px solid #cfe0ec;font:600 1rem "Baloo 2";color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--blue);background:#fff;color:var(--blue);font:700 .9rem "Baloo 2";cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.plist{list-style:none;padding:0;margin:10px 0 0}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px dashed #d6e4ee;font-weight:700}
.x{background:#ffe1e8;border:0;border-radius:10px;color:var(--red);width:32px;height:32px;cursor:pointer;font-weight:800}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.check input{width:22px;height:22px}
.q{font-size:1.3rem;font-weight:800;line-height:1.3;margin:.3em 0}
.tag{display:inline-block;background:#e1f3fb;color:var(--blue);border-radius:10px;padding:2px 10px;font-size:.85rem;font-weight:800}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px;background:var(--glass);border:2px solid rgba(255,255,255,.15);font:700 1.1rem "Baloo 2";color:#fff;width:100%;cursor:pointer}
.status.ok{border-color:var(--green);background:rgba(6,214,160,.2)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid #d6e4ee;background:#f5fafd;font:600 1rem "Baloo 2";margin-bottom:8px;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--a);background:#fff4d6}
.link{background:none;border:0;color:var(--blue);font:800 .95rem "Baloo 2";cursor:pointer;padding:0 0 10px}
.azul{border:4px solid var(--blue)}.vermelho{border:4px solid var(--red)}
.certa{background:#dff3fb;border-radius:14px;padding:12px;margin:8px 0;font-weight:700}
.certa.g{font-size:1.5rem;text-align:center}
.pend{display:flex;justify-content:space-around;text-align:center;background:rgba(255,183,3,.15);border:2px solid var(--a);border-radius:18px;padding:10px}
.pend b{font-size:1.6rem;display:block;color:var(--a)}
.ans{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:3px solid transparent;border-radius:18px;padding:12px 16px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);font-family:"Baloo 2"}
.ans .n{font-weight:800;color:var(--blue);display:flex;justify-content:space-between}
.ans .r{font-size:1.2rem;font-weight:600}
.ans.fake{background:#ffe3ea;border-color:var(--red);opacity:.8}
.lr{display:flex;justify-content:space-between;gap:8px;padding:10px;border-radius:12px;margin-top:6px;background:#f2f7fa}
.lr.real{background:#dff3fb}.lr.fake{background:#ffe3ea}
.score{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed #d6e4ee;font-weight:700}
.bar{height:6px;background:#e5eef4;border-radius:9px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue))}
.ganho{background:var(--green);color:#04322a;border-radius:8px;padding:0 6px;font-size:.8rem}
.mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini span{background:var(--glass);border-radius:999px;padding:3px 10px;font-size:.85rem}
.centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.manual h3{color:var(--blue);margin-top:14px}.manual p,.manual li{line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:.92rem}td{padding:6px;border-bottom:1px solid #e5eef4;vertical-align:top}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(2,15,26,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;backdrop-filter:blur(4px)}
.modal .card{max-width:420px;width:100%;max-height:85vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-180%);background:#fff;color:var(--ink);font-weight:800;padding:10px 18px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .3s;z-index:30;text-align:center;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
.confete{position:fixed;top:-40px;pointer-events:none;z-index:20;animation:cair 3.2s linear forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(540deg)}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script src="perguntas.js"></script>
<script src="perguntas2.js"></script>
<script src="app.js"></script>
</body>
</html>
